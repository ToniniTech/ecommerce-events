# ═══════════════════════════════════════════════════════════════════════════
# notification-db.yaml — same pattern as auth-db.yaml.
# Uses the existing notification-db-secret (notifuser/notifpass)
#  defined in secrets_example.yaml
#
#  ⚠️  FOR LOCAL DEVELOPMENT ONLY (minikube/kind).
#  These are the same default values ​​used in docker-compose.yml,
#  ensuring the cluster starts up just as it does currently.
#
#  For actual production, an external secret manager is used (Sealed Secrets, External Secrets + Vault/
#  AWS Secrets Manager, etc.), but that is a subsequent step once this
#  is working.
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
  namespace: ecommerce
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_USER: authuser
  MYSQL_PASSWORD: authpass
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: ecommerce
type: Opaque
stringData:
