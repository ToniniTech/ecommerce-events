apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-payment-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z payment-db 3306; do echo waiting for payment-db; sleep 2; done
              until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done

      containers:
        - name: payment-service
          image: payment-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: payment-db-secret, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: payment-db-secret, key: MYSQL_PASSWORD }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_PASS }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce
spec:
  selector:
    app: payment-service
  ports:
    - port: 8082
      targetPort: 8082
