# ═══════════════════════════════════════════════════════════════════════════
#  deployment.yaml — patrón Deployment para un microservicio sin estado
#
#  El punto clave que NO tiene equivalente directo en k8s: en tu
#  docker-compose.yml, `depends_on: auth-db: condition: service_healthy`
#  bloquea el arranque de auth-service hasta que el healthcheck de auth-db
#  pasa. Kubernetes no tiene "depends_on" — todos los pods arrancan en
#  paralelo. Si auth-service intenta conectar a MySQL antes de que esté
#  listo, Spring puede fallar al arrancar y el pod entra en CrashLoopBackOff.
#
#  La solución estándar es un initContainer: un contenedor que corre ANTES
#  que el contenedor principal y debe terminar con éxito para que este
#  arranque. Aquí simplemente hace polling al puerto 3306 de auth-db hasta
#  que responde.
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-auth-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z auth-db 3306; do echo esperando a auth-db; sleep 2; done"
      containers:
        - name: auth-service
          # Construida localmente — ver notas de despliegue sobre cómo
          # apuntar el daemon de Docker de minikube antes del build.
          image: auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: auth-db-secret, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: auth-db-secret, key: MYSQL_PASSWORD }
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: auth-service-secret, key: ADMIN_EMAIL }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: auth-service-secret, key: ADMIN_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: auth-service-secret, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084
