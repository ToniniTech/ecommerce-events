apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-order-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z order-db 3306; do echo waiting for order-db; sleep 2; done
              until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
              until nc -z auth-service 8084; do echo waiting for auth-service; sleep 2; done
              until nc -z product-service 8085; do echo waiting for product-service; sleep 2; done
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-service-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-db-secret, key: MYSQL_PASSWORD }
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: rabbitmq-secret, key: RABBITMQ_DEFAULT_USER}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: rabbitmq-secret, key: RABBITMQ_DEFAULT_PASS}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: auth-service-secret, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
